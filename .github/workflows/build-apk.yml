name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # پیدا کردن خودکار مسیر package.json در صورت وجود در پوشه‌های فرعی
      - name: Locate Project Root
        id: find-root
        run: |
          if [ -f "package.json" ]; then
            echo "ROOT_DIR=." >> $GITHUB_ENV
          else
            FOUND=$(find . -maxdepth 3 -name "package.json" | head -n 1)
            if [ -n "$FOUND" ]; then
              DIR=$(dirname "$FOUND")
              echo "Found package.json in $DIR"
              echo "ROOT_DIR=$DIR" >> $GITHUB_ENV
            else
              echo "ERROR: package.json not found in repository!"
              exit 1
            fi
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies & Build Web Assets
        working-directory: ${{ env.ROOT_DIR }}
        run: |
          npm install
          npm run build

      - name: Setup Capacitor & Generate Android Project
        working-directory: ${{ env.ROOT_DIR }}
        run: |
          npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0
          npx cap init "LocalNet" "com.localnet.mesh" --web-dir dist
          npx cap add android || true
          npx cap sync android

      - name: Build APK with Gradle
        working-directory: ${{ env.ROOT_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalNet-Android-APK
          path: ${{ env.ROOT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
